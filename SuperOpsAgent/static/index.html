<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperOpsAgent</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/static/styles.css?v=20260829-sidebar-v1">
    <!-- Markdown 渲染库 -->
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
    <!-- 代码高亮库（可选） -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css">
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/es/highlight.min.js"></script>
</head>
<body>
    <div class="app-layout">
        <!-- 左侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-brand-mark" aria-hidden="true">S</div>
                <div>
                    <h2 class="sidebar-title">SuperOpsAgent</h2>
                    <p class="sidebar-subtitle">智能运维助手</p>
                </div>
            </div>

            <div class="sidebar-content">
                <button class="sidebar-nav-btn new-chat-btn" id="newChatBtn">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M7 17.5L4 20V6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v7a2.5 2.5 0 0 1-2.5 2.5H8.8L7 17.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                        <path d="M12 7.5v5M9.5 10h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                    </svg>
                    <span>新建对话</span>
                </button>

                <button class="sidebar-nav-btn" id="manageDocumentsItem">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M5 4.5A2.5 2.5 0 0 1 7.5 2H19v17H7.5A2.5 2.5 0 0 0 5 21.5v-17Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                        <path d="M5 21.5A2.5 2.5 0 0 1 7.5 19H19M9 7h6M9 11h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                    </svg>
                    <span>文档管理</span>
                </button>

                <button class="sidebar-nav-btn" id="uploadFileItem">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5M5 14v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span>上传文件</span>
                </button>

                <div class="sidebar-divider" aria-hidden="true"></div>

                <div class="sidebar-collapsible chat-history-section" id="chatHistorySection">
                    <button class="sidebar-nav-btn sidebar-toggle" id="chatHistoryToggle" aria-expanded="false" aria-controls="chatHistoryPanel">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M3.5 12a8.5 8.5 0 1 0 2.49-6.01L3.5 8.5M3.5 4.5v4h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M12 7.5V12l3 2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        <span>最近对话</span>
                        <span class="sidebar-nav-end">
                            <span class="sidebar-count" id="chatHistoryCount" hidden></span>
                            <svg class="sidebar-chevron" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="m7.5 5 5 5-5 5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        </span>
                    </button>
                    <div class="sidebar-panel" id="chatHistoryPanel">
                        <div class="chat-history-list" id="chatHistoryList"></div>
                    </div>
                </div>

                <div class="sidebar-collapsible index-tasks-section" id="indexTasksSection">
                    <button class="sidebar-nav-btn sidebar-toggle" id="indexTasksToggle" aria-expanded="false" aria-controls="indexTasksPanel">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M5 4h14v16H5zM8 8h8M8 12h5M8 16h3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        <span>索引任务</span>
                        <span class="sidebar-nav-end">
                            <span class="sidebar-count sidebar-count-alert" id="indexTaskBadge" hidden></span>
                            <svg class="sidebar-chevron" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="m7.5 5 5 5-5 5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        </span>
                    </button>
                    <div class="sidebar-panel" id="indexTasksPanel">
                        <div class="index-task-toolbar">
                            <span>仅显示失败或待重试任务</span>
                            <button class="task-refresh-btn" id="refreshIndexTasksBtn" title="刷新索引任务" aria-label="刷新索引任务">↻</button>
                        </div>
                        <div class="index-task-list" id="indexTaskList">
                            <div class="index-task-empty">索引正常，无待处理异常</div>
                        </div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- 主内容区域 -->
        <main class="main-content">
            <button class="ai-ops-top-btn" id="aiOpsSidebarBtn">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M2 17L12 22L22 17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M2 12L12 17L22 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>AI Ops</span>
            </button>
            <div class="chat-container">
                <div class="welcome-greeting" id="welcomeGreeting">
                    <p>你好！我是 SuperOpsAgent</p>
                </div>
                <div class="chat-messages" id="chatMessages">
                </div>
                
                <div class="chat-input-container">
                    <div class="input-group-wrapper">
                        <div class="input-wrapper">
                            <input type="text" id="messageInput" placeholder="输入问题，或描述你遇到的情况" maxlength="1000" class="message-input">
                            <div class="input-bottom-bar">
                                <span class="input-hint">Enter 发送</span>
                                <div class="right-actions">
                                    <div class="mode-selector-wrapper">
                                        <button class="mode-selector-btn" id="modeSelectorBtn">
                                            <span id="currentModeText">快速</span>
                                            <svg class="dropdown-arrow" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                                <path d="M6 9L12 15L18 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                            </svg>
                                        </button>
                                        <div class="mode-dropdown" id="modeDropdown">
                                            <div class="dropdown-header">选择对话方式</div>
                                            <div class="dropdown-item active" data-mode="quick">
                                                <div class="dropdown-item-main">
                                                    <span>快速</span>
                                                    <span class="badge-new">新</span>
                                                </div>
                                                <div class="dropdown-item-sub">快速对话</div>
                                            </div>
                                            <div class="dropdown-item" data-mode="stream">
                                                <div class="dropdown-item-main">
                                                    <span>流式</span>
                                                </div>
                                                <div class="dropdown-item-sub">流式对话</div>
                                            </div>
                                        </div>
                                    </div>
                                    <button class="send-btn-circle" id="sendButton" title="发送">
                                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                            <path d="M22 2L11 13M22 2L15 22L11 13M22 2L2 9L11 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                        </svg>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <input type="file" id="fileInput" accept=".txt,.md,.markdown" style="display: none;">
                </div>
            </div>
        </main>
    </div>

    <div class="knowledge-modal" id="knowledgeModal" aria-hidden="true">
        <div class="knowledge-dialog">
            <header class="knowledge-header">
                <div>
                    <h2>知识文档</h2>
                    <p>原文保存在 PostgreSQL，保存后异步更新 Milvus 与 Elasticsearch。</p>
                </div>
                <button class="knowledge-close" id="knowledgeCloseBtn" aria-label="关闭">×</button>
            </header>
            <div class="knowledge-body">
                <aside class="knowledge-list-pane">
                    <button class="knowledge-new-btn" id="knowledgeNewBtn">＋ 新建文档</button>
                    <div class="knowledge-list" id="knowledgeDocumentList"></div>
                </aside>
                <section class="knowledge-editor-pane">
                    <div class="knowledge-empty" id="knowledgeEmpty">选择一份文档，或新建文档</div>
                    <form class="knowledge-form" id="knowledgeForm" hidden>
                        <input type="hidden" id="knowledgeDocumentId">
                        <input type="hidden" id="knowledgeDocumentVersion">
                        <label>标题<input id="knowledgeTitle" maxlength="500" required></label>
                        <label>来源路径<input id="knowledgeSourcePath" maxlength="2000" required></label>
                        <div class="knowledge-content-label">
                            <span class="knowledge-content-title">文档内容</span>
                            <div class="knowledge-editor-toolbar" id="knowledgeEditorToolbar" aria-label="文档格式工具栏">
                                <button type="button" data-editor-command="formatBlock" data-editor-value="p" title="正文">正文</button>
                                <button type="button" data-editor-command="formatBlock" data-editor-value="h2" title="标题">标题</button>
                                <button type="button" data-editor-command="bold" title="粗体"><strong>B</strong></button>
                                <button type="button" data-editor-command="insertUnorderedList" title="项目列表">• 列表</button>
                                <button type="button" data-editor-command="insertOrderedList" title="编号列表">1. 列表</button>
                                <button type="button" data-editor-command="formatBlock" data-editor-value="blockquote" title="引用">引用</button>
                                <button type="button" data-editor-command="formatBlock" data-editor-value="pre" title="代码块">代码</button>
                            </div>
                            <div id="knowledgeContent" class="knowledge-rich-editor" contenteditable="true" role="textbox" aria-multiline="true" aria-label="文档内容"></div>
                        </div>
                        <div class="knowledge-actions">
                            <span id="knowledgeIndexStatus"></span>
                            <button type="button" class="secondary" id="knowledgeReindexBtn">重建索引</button>
                            <button type="button" class="danger" id="knowledgeDeleteBtn">删除</button>
                            <button type="submit" class="primary" id="knowledgeSaveBtn">保存</button>
                        </div>
                    </form>
                </section>
            </div>
        </div>
    </div>

    <!-- 加载遮罩层 -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-content">
            <div class="loading-spinner"></div>
            <div class="loading-text">智能运维分析中，请稍候...</div>
            <div class="loading-subtext">后端正在处理，请耐心等待</div>
        </div>
    </div>

    <script src="/static/app.js?v=20260829-sidebar-v1"></script>
</body>
</html>
